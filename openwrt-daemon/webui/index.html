<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeriHeri OpenWRT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { margin: 0; display: flex; height: 100vh; width: 100vw; background-color: #f3f4f6; font-family: 'Inter', sans-serif; color: #111827; }
        .sidebar { width: 260px; background: #ffffff; border-right: 1px solid #111827; display: flex; flex-direction: column; padding: 24px; box-sizing: border-box; }
        .logo-text { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: 1px; }
        .badge { background: #111827; color: #ffffff; padding: 4px 8px; font-size: 11px; font-weight: 700; display: inline-block; margin-top: 8px; }
        
        .main-content { flex: 1; padding: 48px; overflow-y: auto; }
        .card { background: #ffffff; padding: 32px; border: 2px solid #111827; box-shadow: 8px 8px 0px 0px rgba(17, 24, 39, 1); max-width: 400px; display: flex; flex-direction: column; gap: 16px; }
        .card-title { margin: 0; font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .input { padding: 10px 12px; border: 1px solid #111827; font-size: 13px; outline: none; border-radius: 0; }
        
        .btn-primary { background: #111827; color: #ffffff; padding: 12px; border: 1px solid #111827; font-size: 12px; font-weight: 700; text-transform: uppercase; cursor: pointer; letter-spacing: 1px; }
        .btn-secondary { background: #ffffff; color: #111827; padding: 12px; border: 1px solid #111827; font-size: 12px; font-weight: 700; text-transform: uppercase; cursor: pointer; letter-spacing: 1px; }
        .btn-lang { background: #ffffff; color: #111827; border: 1px solid #111827; padding: 4px 8px; font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; margin-top: 12px; align-self: flex-start; }
        .btn-primary:active, .btn-secondary:active, .btn-lang:active { transform: translate(2px, 2px); }

        .hidden { display: none !important; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot-red { background: #ef4444; }
        .dot-green { background: #10b981; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255, 255, 255, 0.9); display: flex; justify-content: center; align-items: center; z-index: 999; }
        .modal-box { background: #ffffff; padding: 32px; border: 2px solid #111827; box-shadow: 8px 8px 0px 0px rgba(17, 24, 39, 1); width: 340px; display: flex; flex-direction: column; gap: 16px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div>
            <div style="display: flex; align-items: baseline; gap: 10px;">
                <h1 class="logo-text">HERIHERI</h1>
                <div style="position: relative; cursor: pointer;" onclick="document.getElementById('update-modal').classList.remove('hidden')">
                    <span style="font-size: 12px; font-weight: 900; color: #4b5563;" id="app-version">V...</span>
                    <div id="update-dot" class="hidden" style="position: absolute; top: -2px; right: -6px; width: 6px; height: 6px; background-color: #ef4444; border-radius: 50%;"></div>
                </div>
            </div>
            <div class="badge">OPENWRT DAEMON</div>
            <div>
                <button class="btn-lang" onclick="toggleLanguage()" id="lang-toggle">中文</button>
            </div>
        </div>
        <div style="margin-top: auto; border-top: 1px solid #e5e7eb; padding-top: 16px;">
            <div class="input-label" data-i18n="statusLabel">Status</div>
            <div id="sidebar-status" style="font-size: 12px; font-weight: 700; margin-top: 4px;">
                <span class="status-dot dot-red" id="status-dot"></span> <span id="status-text" data-state="offline">DISCONNECTED</span>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <!-- LOGIN CARD -->
        <div id="login-view" class="card">
            <h3 class="card-title" data-i18n="loginTitle">Login to Lanzou</h3>
            <div class="input-group">
                <label class="input-label" data-i18n="phoneLabel">Phone Number</label>
                <input type="text" id="phone" class="input" data-i18n-ph="phonePlaceholder" placeholder="Enter phone">
            </div>
            <div class="input-group">
                <label class="input-label" data-i18n="passLabel">Password</label>
                <input type="password" id="password" class="input" data-i18n-ph="passPlaceholder" placeholder="Enter password">
            </div>
            <button class="btn-primary" onclick="handleLogin()" id="login-btn" data-i18n="signIn">Sign In</button>
            <div id="login-error" style="color: #ef4444; font-size: 12px; font-weight: 700;" class="hidden"></div>
        </div>

        <!-- DASHBOARD CARD -->
        <div id="dashboard-view" class="card hidden">
            <h3 class="card-title" data-i18n="dashTitle">Daemon Dashboard</h3>
            
            <div class="input-group" style="flex-direction: row; justify-content: space-between; align-items: center;">
                <div>
                    <label class="input-label" data-i18n="accountLabel">Account</label>
                    <div style="font-size: 14px; font-weight: 700;" id="dash-phone">---</div>
                </div>
                <button class="btn-secondary" style="padding: 6px 12px; font-size: 10px;" onclick="handleLogout()" data-i18n="logout">Logout</button>
            </div>
            
            <hr style="border: none; border-top: 1px solid #e5e7eb; width: 100%; margin: 4px 0;" />
            
            <div class="input-group">
                <label class="input-label" data-i18n="webdavUser">WebDAV Username</label>
                <input type="text" id="dav-user" class="input">
            </div>
            <div class="input-group">
                <label class="input-label" data-i18n="webdavPass">WebDAV Password</label>
                <input type="text" id="dav-pass" class="input">
            </div>
            <div class="input-group">
                <label class="input-label" data-i18n="webdavPort">WebDAV Port (Requires Restart)</label>
                <input type="number" id="dav-port" class="input">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 8px;">
                <button class="btn-primary" style="flex: 1;" onclick="saveConfig()" id="save-cfg-btn" data-i18n="saveConfig">Save Config</button>
                <button class="btn-secondary" style="flex: 1;" onclick="handleSync()" id="sync-btn" data-i18n="forceSync">Force Sync Pull</button>
            </div>
        </div>
    </main>

    <!-- UPDATE MODAL -->
    <div id="update-modal" class="modal-overlay hidden" onclick="document.getElementById('update-modal').classList.add('hidden')">
        <div class="modal-box" onclick="event.stopPropagation()">
            <h3 class="card-title" data-i18n="versionInfo">Version Info</h3>
            
            <div style="font-size: 13px; font-weight: 700; color: #111827; line-height: 1.6;" id="update-body">
                Checking version...
            </div>

            <div style="margin-top: 8px; font-size: 11px; font-weight: 700;">
                <span style="color: #4b5563;" data-i18n="directLink">Direct Link:</span> 
                <a href="https://github.com/AgainsTurb/HeriHeriCloud/releases" target="_blank" style="color: #3b82f6; word-break: break-all;">
                    https://github.com/AgainsTurb/HeriHeriCloud/releases
                </a>
            </div>

            <button class="btn-secondary" style="margin-top: 8px; width: 100%;" onclick="document.getElementById('update-modal').classList.add('hidden')" data-i18n="close">Close</button>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                statusLabel: "Status",
                statusOnline: "ONLINE",
                statusOffline: "DISCONNECTED",
                loginTitle: "Login to Lanzou",
                phoneLabel: "Phone Number",
                phonePlaceholder: "Enter phone",
                passLabel: "Password",
                passPlaceholder: "Enter password",
                signIn: "Sign In",
                connecting: "CONNECTING...",
                dashTitle: "Daemon Dashboard",
                accountLabel: "Account",
                webdavLabel: "WebDAV Server",
                webdavStatus: "Running on Port 8888",
                forceSync: "Force Sync Pull",
                syncing: "SYNCING...",
                syncComplete: "Sync Complete!",
                loginError: "Login failed. Check credentials or WAF.",
                logout: "Logout",
                webdavUser: "WebDAV Username",
                webdavPass: "WebDAV Password",
                webdavPort: "WebDAV Port (Requires Restart)",
                saveConfig: "Save Config",
                configSaved: "Config Saved!",
                versionInfo: "Version Info",
                directLink: "Direct Link:",
                close: "Close"
            },
            zh: {
                statusLabel: "状态",
                statusOnline: "已连接",
                statusOffline: "未连接",
                loginTitle: "登录蓝奏云",
                phoneLabel: "手机号码",
                phonePlaceholder: "请输入手机号",
                passLabel: "密码",
                passPlaceholder: "请输入密码",
                signIn: "登录",
                connecting: "连接中...",
                dashTitle: "服务仪表盘",
                accountLabel: "当前账号",
                webdavLabel: "WebDAV 服务",
                webdavStatus: "运行于端口 8888",
                forceSync: "同步拉取",
                syncing: "同步中...",
                syncComplete: "同步完成！",
                loginError: "登录失败，请检查账号密码或WAF。",
                logout: "退出登录",
                webdavUser: "WebDAV 用户名",
                webdavPass: "WebDAV 密码",
                webdavPort: "WebDAV 端口 (需重启生效)",
                saveConfig: "保存配置",
                configSaved: "配置已保存！",
                versionInfo: "版本信息",
                directLink: "下载链接:",
                close: "关闭"
            }
        };

        let currentLang = localStorage.getItem('heri_lang') || (navigator.language.startsWith('zh') ? 'zh' : 'en');

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('heri_lang', lang);
            document.getElementById('lang-toggle').innerText = lang === 'en' ? '中文' : 'EN';
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    el.innerText = translations[currentLang][key];
                }
            });

            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if (translations[currentLang][key]) {
                    el.placeholder = translations[currentLang][key];
                }
            });

            const statusText = document.getElementById('status-text');
            if (statusText.dataset.state === 'online') {
                statusText.innerText = translations[currentLang].statusOnline;
            } else {
                statusText.innerText = translations[currentLang].statusOffline;
            }
        }

        function toggleLanguage() {
            setLanguage(currentLang === 'en' ? 'zh' : 'en');
        }

        async function checkForUpdates(currentVersion) {
            try {
                const res = await fetch(`https://raw.githubusercontent.com/AgainsTurb/HeriHeriCloud/main/CHANGELOG.md?t=${Date.now()}`, { cache: 'no-store' });
                if (!res.ok) return;
                const text = await res.text();
                const match = text.match(/##\s*\[([^\]]+)\]/);
                if (!match) return;
                
                const latestVer = match[1];
                const isNewer = latestVer.localeCompare(currentVersion, undefined, { numeric: true, sensitivity: 'base' }) > 0;
                
                const bodyEl = document.getElementById('update-body');
                if (isNewer) {
                    document.getElementById('update-dot').classList.remove('hidden');
                    bodyEl.innerHTML = `<span style="color: #ef4444">New Version: V${latestVer}</span><br><span style="color: #4b5563">Current: V${currentVersion}</span>`;
                } else {
                    bodyEl.innerHTML = `Up to date: V${currentVersion}`;
                }
            } catch (err) {
                console.error("Version check failed", err);
                document.getElementById('update-body').innerText = `V${currentVersion}`;
            }
        }

        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                // Inject Version Data
                if (data.version) {
                    document.getElementById('app-version').innerText = `V${data.version}`;
                    checkForUpdates(data.version);
                }

                const statusText = document.getElementById('status-text');
                if (data.logged_in) {
                    document.getElementById('login-view').classList.add('hidden');
                    document.getElementById('dashboard-view').classList.remove('hidden');
                    statusText.dataset.state = "online";
                    statusText.innerText = translations[currentLang].statusOnline;
                    document.getElementById('status-dot').className = "status-dot dot-green";
                    document.getElementById('dash-phone').innerText = data.phone;
                    loadConfig();
                } else {
                    document.getElementById('login-view').classList.remove('hidden');
                    document.getElementById('dashboard-view').classList.add('hidden');
                    statusText.dataset.state = "offline";
                    statusText.innerText = translations[currentLang].statusOffline;
                    document.getElementById('status-dot').className = "status-dot dot-red";
                }
            } catch (e) {
                console.error("Daemon offline");
            }
        }

        async function handleLogin() {
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const errDiv = document.getElementById('login-error');
            const loginBtn = document.getElementById('login-btn');
            
            errDiv.classList.add('hidden');
            loginBtn.innerText = translations[currentLang].connecting;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });

                if (res.ok) {
                    fetchStatus();
                } else {
                    errDiv.innerText = translations[currentLang].loginError;
                    errDiv.classList.remove('hidden');
                }
            } catch (e) {
                errDiv.innerText = translations[currentLang].loginError;
                errDiv.classList.remove('hidden');
            }
            loginBtn.innerText = translations[currentLang].signIn;
        }

        async function handleSync() {
            const btn = document.getElementById('sync-btn');
            btn.innerText = translations[currentLang].syncing;
            await fetch('/api/sync', { method: 'POST' });
            btn.innerText = translations[currentLang].forceSync;
            alert(translations[currentLang].syncComplete);
        }

        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                const cfg = await res.json();
                document.getElementById('dav-user').value = cfg.username;
                document.getElementById('dav-pass').value = cfg.password;
                document.getElementById('dav-port').value = cfg.port;
            } catch (e) { console.error("Failed to load config"); }
        }

        async function saveConfig() {
            const btn = document.getElementById('save-cfg-btn');
            const username = document.getElementById('dav-user').value;
            const password = document.getElementById('dav-pass').value;
            const port = parseInt(document.getElementById('dav-port').value);
            
            btn.innerText = "...";
            const res = await fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, port })
            });
            
            const responseText = await res.text();
            
            if (responseText === "Restarting") {
                btn.innerText = "RESTARTING...";
                setTimeout(() => {
                    window.location.port = port;
                }, 2000);
            } else {
                btn.innerText = translations[currentLang].configSaved;
                setTimeout(() => btn.innerText = translations[currentLang].saveConfig, 2000);
            }
        }

        async function handleLogout() {
            await fetch('/api/logout', { method: 'POST' });
            document.getElementById('phone').value = '';
            document.getElementById('password').value = '';
            fetchStatus();
        }

        // Init
        setLanguage(currentLang);
        fetchStatus();
    </script>
</body>
</html>
