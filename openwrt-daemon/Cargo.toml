[package]
name = "heriheri-openwrt"
version = "1.2.1"
edition = "2021"

[dependencies]
# Async Runtime & Web Server
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
bytes = "1.0"
async-stream = "0.3"
futures = "0.3.32"
futures-util = "0.3"

# Networking
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "cookies", "json", "multipart", "gzip", "brotli", "deflate", "stream", "blocking"] }
mime_guess = "2.0"

# Cryptography & Utilities
chacha20poly1305 = "0.10.1"
rand = "0.8.5"
base64 = "0.21.5"
hex = "0.4"
md5 = "0.7"
regex = "1.10"
chrono = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"