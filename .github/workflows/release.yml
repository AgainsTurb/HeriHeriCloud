name: "Publish Release"

on:
  push:
    tags:
      - 'v*'

env:
  GSTREAMER_VERSION: '1.28.6'
  ANDROID_NDK_VERSION: '29.0.13846066'

jobs:
  # --- PHASE 1: CREATE THE UNIFIED RELEASE DRAFT ---
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      changelog_body: ${{ steps.changelog.outputs.body }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract changelog for current version
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## \[/ {
              if (index($0, "[" ver "]")) { found=1; print; next }
              else if (found) exit
            }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$BODY" ]; then
            BODY="No changelog found for version ${VERSION}."
          fi

          # Fix multiline output escaping for modern GitHub Actions
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Initialize GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.body }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" \
              --title "HeriHeri v${GITHUB_REF_NAME#v}" \
              --notes-file release-notes.md \
              --draft=true
          else
            gh release create "${{ github.ref_name }}" \
              --title "HeriHeri v${GITHUB_REF_NAME#v}" \
              --notes-file release-notes.md \
              --draft=true
          fi

  # --- PHASE 2: COMPILE DESKTOP TARGETS (RUNS IN PARALLEL) ---
  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
            cache_suffix: "universal"
          - platform: "ubuntu-22.04"
            args: ""
            cache_suffix: "x86_64"
          - platform: "windows-latest"
            args: ""
            cache_suffix: "x86_64"
          - platform: "windows-latest"
            args: "--target i686-pc-windows-msvc"
            cache_suffix: "x86"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || (matrix.args == '--target i686-pc-windows-msvc' && 'i686-pc-windows-msvc' || '') }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Cache downloaded GStreamer SDKs
        uses: actions/cache@v4
        with:
          path: .gstreamer
          key: gstreamer-${{ runner.os }}-${{ matrix.cache_suffix }}-${{ env.GSTREAMER_VERSION }}-${{ hashFiles('scripts/setup-gstreamer.mjs', 'scripts/setup-gstreamer-windows.ps1') }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # The hosted image can retain a held libunwind package. GStreamer's
          # development package requires libunwind-dev, so install it first
          # with explicit permission to reconcile that held dependency.
          sudo apt-get install -y \
            --allow-change-held-packages \
            --allow-downgrades \
            libunwind8 \
            libunwind-dev
          sudo apt-get install -y \
            libgtk-3-dev \
            webkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-gl \
            gstreamer1.0-gtk3 \
            gstreamer1.0-pulseaudio

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri Application & Inject Assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HERIHERI_SECRET_KEY: ${{ secrets.HERIHERI_SECRET_KEY }}
          CHUNKS_NAMES_KEY: ${{ secrets.CHUNKS_NAMES_KEY }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
        with:
          tauriScript: npm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: "HeriHeri v__VERSION__"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: GPG Sign Linux Packages
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.GPG_PRIVATE_KEY_BASE64 }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GPG_PRIVATE_KEY_BASE64" | base64 --decode > private.key
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 --import private.key

          shopt -s nullglob
          for file in src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage; do
            if [ -f "$file" ]; then
              echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 --pinentry-mode loopback --detach-sign --armor "$file"
              
              gh release upload ${{ github.ref_name }} "$file.asc" --clobber
            fi
          done

  # --- PHASE 3: COMPILE MOBILE TARGETS (RUNS IN PARALLEL) ---
  publish-android:
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install required Android SDK and NDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;$ANDROID_NDK_VERSION"

          NDK_ROOT="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          test -f "$NDK_ROOT/source.properties"
          {
            echo "NDK_HOME=$NDK_ROOT"
            echo "ANDROID_NDK_HOME=$NDK_ROOT"
            echo "ANDROID_NDK_ROOT=$NDK_ROOT"
            echo "HERI_ANDROID_NDK_VERSION=$ANDROID_NDK_VERSION"
          } >> "$GITHUB_ENV"

      - name: Install Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Cache Android GStreamer SDK
        uses: actions/cache@v4
        with:
          path: .gstreamer
          key: gstreamer-android-${{ env.GSTREAMER_VERSION }}-${{ hashFiles('scripts/setup-gstreamer.mjs') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Android Code Signing Assets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd src-tauri/gen/android
          
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > herihericloud-key.jks
          
          echo "keyAlias=herihericloud" > keystore.properties
          echo "password=$ANDROID_KEYSTORE_PASSWORD" >> keystore.properties
          echo "storeFile=../herihericloud-key.jks" >> keystore.properties

      - name: Build Android APK
        env:
            HERIHERI_SECRET_KEY: ${{ secrets.HERIHERI_SECRET_KEY }}
            CHUNKS_NAMES_KEY: ${{ secrets.CHUNKS_NAMES_KEY }}
        run: |
          npm run tauri android build -- --apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HERIHERI_SECRET_KEY: ${{ secrets.HERIHERI_SECRET_KEY }}
          CHUNKS_NAMES_KEY: ${{ secrets.CHUNKS_NAMES_KEY }}
        with:
          tag_name: ${{ github.ref_name }}
          files: 'src-tauri/gen/android/app/build/outputs/apk/**/*.apk'

  # --- PHASE 3.5: COMPILE OPENWRT TARGETS (RUNS IN PARALLEL) ---
  publish-openwrt:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabi
          - mipsel-unknown-linux-musl
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cross
        run: cargo install cross --locked --version 0.2.5

      - name: Inject Secret Keys and Map Mipsel Image
        run: |
          mkdir -p .cargo
          echo "[env]" > .cargo/config.toml
          echo 'HERIHERI_SECRET_KEY = "${{ secrets.HERIHERI_SECRET_KEY }}"' >> .cargo/config.toml
          echo 'CHUNKS_NAMES_KEY = "${{ secrets.CHUNKS_NAMES_KEY }}"' >> .cargo/config.toml

          echo '[target.mipsel-unknown-linux-musl]' >> .cargo/config.toml
          echo 'linker = "mipsel-unknown-linux-musl-gcc"' >> .cargo/config.toml
          
          echo '[target.mipsel-unknown-linux-musl]' > Cross.toml
          echo 'image = "messense/rust-musl-cross:mipsel-musl"' >> Cross.toml

      - name: Build OpenWRT Daemon
        run: |
          cd openwrt-daemon
          cross build --target ${{ matrix.target }} --release

      - name: Rename and Upload Binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "openwrt-daemon/target/${{ matrix.target }}/release/heriheri-cli" ]; then
            mv openwrt-daemon/target/${{ matrix.target }}/release/heriheri-cli heriheri-openwrt-${{ matrix.target }}
          else
            mv target/${{ matrix.target }}/release/heriheri-cli heriheri-openwrt-${{ matrix.target }}
          fi
          gh release upload ${{ github.ref_name }} heriheri-openwrt-${{ matrix.target }} --clobber

  # --- PHASE 3.6: COMPILE DESKTOP CLI (RUNS IN PARALLEL) ---
  publish-cli:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            use_cross: true
            ext: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
            use_cross: true
            ext: ""
          - target: x86_64-pc-windows-gnu
            os: ubuntu-22.04
            use_cross: true
            ext: ".exe"
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux/Windows only)
        if: matrix.use_cross == true
        run: cargo install cross --locked --version 0.2.5

      - name: Inject Secret Keys
        run: |
          mkdir -p .cargo
          echo "[env]" > .cargo/config.toml
          echo 'HERIHERI_SECRET_KEY = "${{ secrets.HERIHERI_SECRET_KEY }}"' >> .cargo/config.toml
          echo 'CHUNKS_NAMES_KEY = "${{ secrets.CHUNKS_NAMES_KEY }}"' >> .cargo/config.toml

      - name: Build CLI Binary
        run: |
          cd openwrt-daemon
          if [ "${{ matrix.use_cross }}" == "true" ]; then
            cross build --target ${{ matrix.target }} --release
          else
            cargo build --target ${{ matrix.target }} --release
          fi

      - name: Rename and Upload Binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "openwrt-daemon/target/${{ matrix.target }}/release/heriheri-cli${{ matrix.ext }}" ]; then
            mv openwrt-daemon/target/${{ matrix.target }}/release/heriheri-cli${{ matrix.ext }} heriheri-cli-${{ matrix.target }}${{ matrix.ext }}
          else
            mv target/${{ matrix.target }}/release/heriheri-cli${{ matrix.ext }} heriheri-cli-${{ matrix.target }}${{ matrix.ext }}
          fi
          gh release upload ${{ github.ref_name }} heriheri-cli-${{ matrix.target }}${{ matrix.ext }} --clobber

  # --- PHASE 4: AUTOMATICALLY PUBLISH THE RELEASE ---
  finalize-release:
    needs: [publish-tauri, publish-android, publish-openwrt, publish-cli]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Publish Release Draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit ${{ github.ref_name }} --repo ${{ github.repository }} --draft=false
